  actions:
    runs-on: [self-hosted, linux, x64, manual-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node --version
          npm --version
          echo "checked out $(git rev-parse --short HEAD)"


  docker-action:
    runs-on: [self-hosted, linux, x64, manual-test]
    steps:
      - uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -c "echo 'hello from a docker container action'; cat /etc/os-release | grep PRETTY"
