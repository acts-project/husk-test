name: manual-test

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: [self-hosted, linux, x64, manual-test]
    steps:
      - name: Show host
        run: |
          echo "hello from $(hostname)"
          echo "user: $(whoami)"
          echo "DOCKER_HOST=$DOCKER_HOST"
      - name: Docker shim works
        run: docker run --rm hello-world

  in-container:
    runs-on: [self-hosted, linux, x64, manual-test]
    container:
      image: ubuntu:24.04
    steps:
      - name: Who am I, and where
        run: |
          echo "running inside: $(cat /etc/os-release | grep PRETTY_NAME)"
          echo "hostname: $(hostname)"
          echo "uid: $(id)"
      - name: Workspace is mounted
        run: |
          pwd
          ls -la
          echo "marker" > container-wrote-this.txt
          cat container-wrote-this.txt
      - name: Container is fully functional (pkg mgr works)
        run: |
          apt-get update -qq
          apt-get install -y -qq jq >/dev/null
          jq --version
